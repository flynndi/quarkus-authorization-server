---
test-client:
  jwks-origin: "https://localhost:${quarkus.http.ssl-port:8443}"
quarkus:
  http:
    host: 127.0.0.1
    tls-configuration-name: jwks-server
    insecure-requests: enabled
  # Public test credentials, copied from deployment/src/test/resources/mtls.
  # Trust only the test CA; outbound JWKS still verifies certificates and hostnames.
  tls:
    jwks-server:
      key-store:
        p12:
          path: jwks/server.p12
          password: password
    jwks-client:
      trust-store:
        pem:
          certs: jwks/ca.pem
  datasource:
    db-kind: h2
    username: sa
    password: sa
    jdbc:
      url: jdbc:h2:mem:client-credentials;DB_CLOSE_DELAY=-1
    devservices:
      enabled: false
  native:
    resources:
      includes: test-private-key.pem,test-public-key.pem,jwks/*
  authorization-server:
    issuer: "${AUTHORIZATION_SERVER_ISSUER:http://localhost:${quarkus.http.port:8080}}"
    client-jwks:
      tls-configuration-name: jwks-client
      allowed-private-origins:
        - "${test-client.jwks-origin}"
    oidc:
      enabled: true
    signing:
      key-id: client-credentials-test-key
      private-key-location: classpath:test-private-key.pem
      public-key-location: classpath:test-public-key.pem
  oidc:
    application-type: service
    auth-server-url: "${quarkus.authorization-server.issuer}"
    discovery-enabled: true
    connection-timeout: 1S
    connection-retry-count: 0
    token:
      audience:
      - machine-client
      - short-lived-client
      - post-client
      - jwt-private
      - jwt-secret
      lifespan-grace: 0
      allow-jwt-introspection: false
      allow-opaque-token-introspection: false
    raw:
      tenant-paths: "/resource/raw"
      application-type: service
      auth-server-url: "${quarkus.authorization-server.issuer}"
      connection-timeout: 1S
      connection-retry-count: 1
      client-id: dpop-resource-server
      credentials:
        secret: resource-secret
      allow-token-introspection-cache: false
      token:
        authorization-scheme: dpop
        allow-jwt-introspection: false
        allow-opaque-token-introspection: true
    guarded:
      tenant-paths: "/resource/guarded"
      application-type: service
      auth-server-url: "${quarkus.authorization-server.issuer}"
      connection-timeout: 1S
      connection-retry-count: 1
      client-id: dpop-resource-server
      credentials:
        secret: resource-secret
      allow-token-introspection-cache: false
      token:
        authorization-scheme: dpop
        allow-jwt-introspection: false
        allow-opaque-token-introspection: true
    lifecycle:
      tenant-paths: "/lifecycle/*"
      application-type: service
      auth-server-url: "${quarkus.authorization-server.issuer}"
      connection-timeout: 1S
      connection-retry-count: 1
      client-id: resource-server
      credentials:
        secret: resource-secret
      allow-token-introspection-cache: false
      token:
        lifespan-grace: 0
        allow-jwt-introspection: false
        allow-opaque-token-introspection: true
"%test":
  test-client:
    jwks-origin: "https://localhost:${quarkus.http.test-ssl-port:8444}"
  quarkus:
    authorization-server:
      issuer: http://localhost:${quarkus.http.test-port:8081}
