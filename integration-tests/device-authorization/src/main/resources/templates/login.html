<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
</head>
<body>
<main>
    <h1>Sign in to verify your device</h1>
    {#if authenticationFailed}
    <p>The username or password was not accepted.</p>
    {/if}
    <form action="/j_security_check" method="post">
        <label for="username">Username</label>
        <input id="username" name="j_username" value="resource-owner" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="j_password" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
