name: CI

on:
  pull_request:
    branches: [dev, main]
    # Retargeting a PR from dev to main must upgrade it to the full release checks.
    types: [opened, synchronize, reopened, edited]
  # Validate merge candidates through PRs; do not repeat the same suite after merging.
  # Manual runs provide the full release checks on any selected branch or tag.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Plan CI checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
      java_versions: ${{ steps.filter.outputs.java_versions }}
      run_native: ${{ steps.filter.outputs.run_native }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # Keep the PR workflow running so docs-only changes can satisfy CI required.
      - name: Select checks for the target branch and changed files
        id: filter
        env:
          TARGET_BRANCH: ${{ github.base_ref }}
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          event = os.environ["GITHUB_EVENT_NAME"]
          development_pr = event == "pull_request" and os.environ["TARGET_BRANCH"] == "dev"
          java_versions = ["21"] if development_pr else ["21", "25"]
          base = os.environ["DIFF_BASE_SHA"]
          head = os.environ["DIFF_HEAD_SHA"]
          run_tests = True
          if event == "pull_request" and base:
              base = subprocess.check_output(["git", "merge-base", base, head], text=True).strip()
              # Disable rename detection: moving code into docs/ must still run tests.
              changed = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z", base, head,
              ])
              paths = [path for path in changed.split(b"\0") if path]
              run_tests = not paths or any(not path.startswith(b"docs/") for path in paths)
              print(f"Changed files: {len(paths)}")
          run_native = run_tests and not development_pr
          print(f"Run JVM tests: {run_tests}; Java versions: {java_versions}; Native: {run_native}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_tests={str(run_tests).lower()}\n")
              output.write(f"java_versions={json.dumps(java_versions)}\n")
              output.write(f"run_native={str(run_native).lower()}\n")
          PY

  jvm:
    name: JVM (Java ${{ matrix.java }})
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ${{ fromJSON(needs.changes.outputs.java_versions) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # Unlike build, check verifies formatting without rewriting committed sources.
      # Keep Quarkus test applications sequential because they share HTTP test ports.
      - name: Check formatting and run JVM and packaged application tests
        run: >-
          ./gradlew check :integration-tests:quarkusIntTest
          "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace
      - name: Upload JVM reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jvm-java-${{ matrix.java }}-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: Native (integration-tests)
    needs: [changes, jvm]
    if: ${{ needs.changes.outputs.run_native == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          distribution: graalvm
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build native executable and run integration tests
        run: >-
          ./gradlew :integration-tests:quarkusIntTest
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.native-image-xmx=6g
          "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace
      - name: Upload Native reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-integration-tests-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, jvm, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A test may be skipped only when the successful plan explicitly excludes it.
      - name: Require all planned checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          RUN_NATIVE: ${{ needs.changes.outputs.run_native }}
          JVM_RESULT: ${{ needs.jvm.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          printf 'JVM: %s\nNative: %s\n' "$JVM_RESULT" "$NATIVE_RESULT"
          test "$CHANGES_RESULT" = success
          if [ "$RUN_TESTS" = false ]; then
            test "$JVM_RESULT" = skipped
            test "$RUN_NATIVE" = false
          else
            test "$RUN_TESTS" = true
            test "$JVM_RESULT" = success
          fi
          if [ "$RUN_NATIVE" = false ]; then
            test "$NATIVE_RESULT" = skipped
          else
            test "$RUN_NATIVE" = true
            test "$NATIVE_RESULT" = success
          fi
