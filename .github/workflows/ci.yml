name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_tests: ${{ steps.filter.outputs.run_tests }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      # Keep the PR workflow running so docs-only changes can satisfy CI required.
      - name: Decide whether JVM and Native tests are needed
        id: filter
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          event = os.environ["GITHUB_EVENT_NAME"]
          base = os.environ["DIFF_BASE_SHA"]
          head = os.environ["DIFF_HEAD_SHA"]
          run_tests = True
          if event in {"pull_request", "push"} and base and set(base) != {"0"}:
              if event == "pull_request":
                  base = subprocess.check_output(["git", "merge-base", base, head], text=True).strip()
              # Disable rename detection: moving code into docs/ must still run tests.
              changed = subprocess.check_output([
                  "git", "diff", "--name-only", "--no-renames", "-z", base, head,
              ])
              paths = [path for path in changed.split(b"\0") if path]
              run_tests = not paths or any(not path.startswith(b"docs/") for path in paths)
              print(f"Changed files: {len(paths)}")
          print(f"Run JVM and Native tests: {run_tests}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_tests={str(run_tests).lower()}\n")
          PY

  jvm:
    name: JVM (Java ${{ matrix.java }})
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      # Unlike build, check verifies formatting without rewriting committed sources.
      # Keep Quarkus test applications sequential because they share HTTP test ports.
      - name: Check formatting and run JVM tests
        run: >-
          ./gradlew check
          "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace
      - name: Upload JVM reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jvm-java-${{ matrix.java }}-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  native:
    name: Native (${{ matrix.module }}, ${{ matrix.profile }})
    needs: jvm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: authorization-code
            profile: prod
          - module: client-credentials
            profile: prod
          - module: device-authorization
            profile: prod
          - module: password-grant
            profile: prod
          - module: token-exchange
            profile: prod
          - module: authorization-code
            profile: multiple-issuers
          - module: authorization-code
            profile: reference-registration
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: graalvm/setup-graalvm@0426e2e191540e8514dff98dc52a5f5146a2a276 # v1
        with:
          distribution: graalvm
          java-version: '21'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Build native executable and run integration tests
        env:
          TEST_MODULE: ${{ matrix.module }}
          TEST_PROFILE: ${{ matrix.profile }}
        run: >-
          ./gradlew ":integration-tests:${TEST_MODULE}:quarkusIntTest"
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.native-image-xmx=6g
          "-Dquarkus.profile=${TEST_PROFILE}"
          "-Dquarkus.test.integration-test-profile=${TEST_PROFILE}"
          "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
          --no-daemon --no-parallel --max-workers=2 --console=plain --stacktrace
      - name: Upload Native reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.module }}-${{ matrix.profile }}-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  required:
    name: CI required
    if: ${{ always() }}
    needs: [changes, jvm, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only a successful docs-only decision permits skipped test matrices.
      - name: Require successful tests or a docs-only change
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          JVM_RESULT: ${{ needs.jvm.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          printf 'JVM: %s\nNative: %s\n' "$JVM_RESULT" "$NATIVE_RESULT"
          test "$CHANGES_RESULT" = success
          if [ "$RUN_TESTS" = false ]; then
            test "$JVM_RESULT" = skipped
            test "$NATIVE_RESULT" = skipped
          else
            test "$RUN_TESTS" = true
            test "$JVM_RESULT" = success
            test "$NATIVE_RESULT" = success
          fi
