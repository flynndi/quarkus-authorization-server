---
quarkus:
  http:
    host: 127.0.0.1
    auth:
      proactive: false
      session:
        encryption-key: device-authorization-browser-test-key
      permission:
        device-verification-endpoint:
          paths: "/oauth2/device_verification"
          policy: authenticated
      form:
        enabled: true
        login-page: "/login"
        post-location: "/j_security_check"
        error-page: "/login?error=true"
        landing-page: "/"
        http-only-cookie: true
        cookie-same-site: lax
  datasource:
    db-kind: h2
    username: sa
    password: sa
    jdbc:
      url: jdbc:h2:mem:device-authorization;DB_CLOSE_DELAY=-1
      max-size: 16
    devservices:
      enabled: false
  native:
    resources:
      includes: test-private-key.pem,test-public-key.pem
  authorization-server:
    issuer: "${AUTHORIZATION_SERVER_ISSUER:http://localhost:${quarkus.http.port:8080}}"
    oidc:
      enabled: true
    signing:
      key-id: device-authorization-test-key
      private-key-location: classpath:test-private-key.pem
      public-key-location: classpath:test-public-key.pem
  oidc:
    application-type: service
    tenant-paths: "/api/*"
    auth-server-url: "${quarkus.authorization-server.issuer}"
    discovery-enabled: true
    connection-timeout: 1S
    connection-retry-count: 1
    client-id: resource-server
    credentials:
      secret: resource-secret
    allow-token-introspection-cache: false
    token:
      lifespan-grace: 0
      allow-jwt-introspection: false
      allow-opaque-token-introspection: true
    raw:
      tenant-paths: "/resource/raw"
      application-type: service
      auth-server-url: "${quarkus.authorization-server.issuer}"
      connection-timeout: 1S
      connection-retry-count: 1
      client-id: dpop-resource-server
      credentials:
        secret: resource-secret
      allow-token-introspection-cache: false
      token:
        authorization-scheme: dpop
        allow-jwt-introspection: false
        allow-opaque-token-introspection: true
    guarded:
      tenant-paths: "/resource/guarded"
      application-type: service
      auth-server-url: "${quarkus.authorization-server.issuer}"
      connection-timeout: 1S
      connection-retry-count: 1
      client-id: dpop-resource-server
      credentials:
        secret: resource-secret
      allow-token-introspection-cache: false
      token:
        authorization-scheme: dpop
        allow-jwt-introspection: false
        allow-opaque-token-introspection: true
"%test":
  quarkus:
    authorization-server:
      issuer: http://localhost:${quarkus.http.test-port:8081}
